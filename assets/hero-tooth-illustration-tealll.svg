<svg width="600" height="700" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroToothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Large decorative tooth -->
  <path d="M300 120
           C 220 120, 165 145, 130 190
           C 95 235, 82 290, 88 350
           C 94 415, 114 480, 138 540
           C 158 590, 178 630, 200 660
           C 216 682, 232 696, 248 696
           C 264 696, 274 662, 282 615
           C 287 585, 291 560, 300 560
           C 309 560, 313 585, 318 615
           C 326 662, 336 696, 352 696
           C 368 696, 384 682, 400 660
           C 422 630, 442 590, 462 540
           C 486 480, 506 415, 512 350
           C 518 290, 505 235, 470 190
           C 435 145, 380 120, 300 120 Z"
        fill="url(#heroToothGrad)" filter="url(#glowTeal)"/>

  <!-- Highlight swoosh -->
  <path d="M195 165
           C 165 195, 148 235, 145 280
           C 144 300, 148 320, 158 335
           C 150 300, 160 258, 182 222
           C 200 194, 226 172, 258 163
           C 235 155, 212 156, 195 165 Z"
        fill="#99f6e4" opacity="0.75"/>

  <!-- Small floating decorative dots -->
  <circle cx="120" cy="150" r="7" fill="#5eead4" opacity="0.8"/>
  <circle cx="480" cy="200" r="10" fill="#5eead4" opacity="0.7"/>
  <circle cx="460" cy="600" r="8" fill="#5eead4" opacity="0.7"/>
  <circle cx="140" cy="580" r="6" fill="#5eead4" opacity="0.8"/>
</svg>
