<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Brand Teal Gradient -->
    <linearGradient id="brandTealGradRealIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Glossy Pure White Tooth Gradient -->
    <linearGradient id="whiteToothGradRealIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="toothRealShadowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Rounded Shield Badge (Clean, No Artifacts) -->
  <rect x="35" y="35" width="430" height="430" rx="100" fill="url(#brandTealGradRealIcon)" filter="url(#toothRealShadowIcon)"/>

  <!-- Tooth Anatomy Path (Centered inside badge) -->
  <path d="M 250 115
           C 210 102, 150 102, 120 135
           C 95 165, 90 205, 96 242
           C 102 280, 115 310, 128 350
           C 140 390, 152 415, 162 440
           C 168 455, 180 460, 192 450
           C 205 440, 215 410, 225 365
           C 233 330, 241 300, 250 300
           C 259 300, 267 330, 275 365
           C 285 410, 295 440, 308 450
           C 320 460, 332 455, 338 440
           C 348 415, 360 390, 372 350
           C 385 310, 398 280, 404 242
           C 410 205, 405 165, 380 135
           C 350 102, 290 102, 250 115 Z"
        fill="url(#whiteToothGradRealIcon)"/>

  <!-- Molar Crown Groove Line -->
  <path d="M 200 130 C 225 150, 275 150, 300 130" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Glossy Reflection Highlight -->
  <path d="M 140 152
           C 120 180, 115 212, 120 245
           C 122 260, 127 272, 134 280
           C 129 255, 130 228, 144 200
           C 156 175, 177 158, 202 147
           C 181 142, 156 143, 140 152 Z"
        fill="#ffffff" opacity="0.85"/>
</svg>
